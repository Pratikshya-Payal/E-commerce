{% extends 'store/base.html' %}
{% block content %}
<div class="auth-card mx-auto my-5">
    <h2 class="mb-4">Sign Up</h2>
    <p class="text-muted mb-4">Create account with mobile or email and use OTP verification.</p>
    <form method="post">{% csrf_token %}
        {{ form.mobile.label_tag }}
        {{ form.mobile }}
        <button class="btn btn-success mt-3">Request OTP</button>
    </form>
    <p class="small text-muted mt-3">Already registered? <a href="{% url 'store:signin' %}">Sign in</a></p>
</div>
{% endblock %}
